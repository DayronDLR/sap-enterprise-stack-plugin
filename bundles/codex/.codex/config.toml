# Servidores MCP del SAP Enterprise Agent Stack.
#
# Generado por emitters/codex.mjs — no editar a mano.
#
# `command = "npx"` a proposito: viene con Node y esta presente en BAS y
# Cloud Foundry. `pnpm` no: un BAS recien creado solo trae npm, y el server
# fallaba con "command not found".

[mcp_servers.sap-cap-capire]
command = "npx"
args = ["-y", "@cap-js/mcp-server@0.0.6"]
startup_timeout_sec = 30

[mcp_servers.sap-ui5]
command = "npx"
args = ["-y", "@ui5/mcp-server@0.3.1"]
startup_timeout_sec = 30

[mcp_servers.sap-fiori-tools]
command = "npx"
args = ["-y", "@sap-ux/fiori-mcp-server@1.15.0", "fiori-mcp"]
startup_timeout_sec = 30

[mcp_servers.sap-adt]
command = "sh"
args = ["-c", "export MCP_ENV_PATH=\"${SAP_ADT_ENV_PATH:-/dev/null}\" SAP_SYSTEM_TYPE=\"${SAP_ADT_SYSTEM_TYPE:-onprem}\"; exec npx -y @mcp-abap-adt/core@7.2.1 --exposition=readonly"]
env_vars = ["SAP_ADT_ENV_PATH", "SAP_ADT_SYSTEM_TYPE"]
# Requiere secrets del usuario: sin ellos el server no arranca,
# pero el resto de la configuracion sigue siendo valida.
startup_timeout_sec = 30
